<main>
  @if(errorMsg){
    <div style="color:red; font-weight:bold;">{{ errorMsg }}</div>
  }

  @if(event){
    <div class="detail-box">
      <h1>{{ event.event_name }}</h1>
      <p><strong>Date:</strong> {{ event.event_datetime }}</p>
      <p><strong>Location:</strong> {{ event.location }}</p>
      <p><strong>Price:</strong> ${{ event.price }}</p>
      <p><strong>Target:</strong> ${{ event.target_fund }}</p>
      <p><strong>Raised:</strong> ${{ event.raised_fund }}</p>
      <hr>
      <p>{{ event.description }}</p>
      <br>
      <a [routerLink]="['/register']" [queryParams]="{eventId: event.event_id}">
        <button>Register</button>
      </a>
    </div>
  }
</main>
